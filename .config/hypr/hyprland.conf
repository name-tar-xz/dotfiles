# Log WLR errors and logs to the hyprland log. Recommended
env = WLR_DRM_DEVICES,/dev/dri/card0
env = HYPRLAND_LOG_WLR,1
env = HYPRLAND_HEADERS,/home/***REMOVED***/.local/share/hyprload/hyprland/

# Tell XWayland to use a cursor theme
env = XCURSOR_THEME,Nero
env = XCURSOR_SIZE,24

# QT
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct

# GTK
env = GTK_THEME,Catppuccin-Mocha-Compact-Mauve-Dark
env = GDK_SCALE,2

# Make wluma work
env = WLR_DRM_NO_MODIFIERS,1

# exec-once = hyprctl setcursor Nero 24
exec-once = wl-paste --watch cliphist store 
exec-once = waybar &
exec-once = swaybg -i ~/Pictures/Wallpaper/the_neon_shallows_by_leikoi_ddm6tx0.png -m stretch
exec-once = swayidle &
# exec-once = wluma &
# exec-once = udiskie &
# exec-once = blueman-applet &
exec-once = [workspace special:2;silent;noanim] kitty -1

monitor = ,highres,auto,1.25,bitdepth,10,vrr,1

input {
  kb_layout = us
  kb_options = caps:escape
  repeat_delay = 300
  repeat_rate = 30
  follow_mouse = 1
  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
  touchpad {
    natural_scroll = true
    disable_while_typing = false 
    tap-to-click = true
    drag_lock = true
  }
}
gestures {
  workspace_swipe = true
  workspace_swipe_create_new = true
  workspace_swipe_forever = false
}


general {
  gaps_in = 0
  gaps_out = 0
  border_size = 2
  col.active_border = 0xff74c7ec
  col.inactive_border = rgba(00000000)
  layout = dwindle
  apply_sens_to_raw = 0 # whether to apply the sensitivity to raw input (e.g. used by games where you aim using your mouse)
  no_border_on_floating = false
}

group {
  col.border_active = rgba(3838ffff) rgba(ff6600ff)
  col.border_inactive = rgba(00000000)
  groupbar {
    gradients = false
    col.inactive = rgba(00000000)
    col.active = rgba(3838ffff)
  }
}
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vfr = true
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
  enable_swallow = true
  animate_manual_resizes = true
  swallow_regex = ^(kitty)$
}

decoration {
  rounding = 10

  active_opacity = 1.0
  inactive_opacity = 0.95

  dim_inactive = true
  dim_strength = 0.3
  dim_special = 0.3

  blur {
    enabled = true
    size = 6
    passes = 2
    new_optimizations = true
    xray = false
    special = false
  }

  drop_shadow = true
  shadow_ignore_window = true
  shadow_offset = 2 2
  shadow_range = 4
  shadow_render_power = 2
  col.shadow = rgba(00000022)
}

xwayland {
  force_zero_scaling = true
}

animations {
  enabled = true
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = smoothOut, 0.36, 0, 0.66, -0.56
  bezier = smoothIn, 0.25, 1, 0.5, 1
  bezier = linear, 0.45, 0, 0.55, 1

  animation = borderangle, 1, 100, linear, loop 
  animation = windows, 1, 5, overshot, slide
  animation = windowsOut, 1, 4, smoothOut, slide
  animation = windowsMove, 1, 4, default
  animation = border, 1, 10, default
  animation = fade, 1, 10, smoothIn
  animation = fadeDim, 1, 10, smoothIn
  animation = workspaces, 1, 6, default
}

dwindle {
  no_gaps_when_only = 1
  pseudotile = true
  preserve_split = false
}

master {
  no_gaps_when_only = 1
  mfact = 0.5
  new_is_master = false
}

windowrule = float, file_progress
windowrule = float, confirm
windowrule = float, dialog
windowrule = float, download
windowrule = float, notification
windowrule = float, error
windowrule = float, splash
windowrule = float, confirmreset
windowrule = float, title:Open File
windowrule = float, title:branchdialog
windowrule = float, viewnior
windowrule = float, file-roller

windowrule = idleinhibit focus, mpv
windowrule = fullscreen, mpv
windowrule = idleinhibit fullscreen, librewolf

windowrule = float, title:^(Media viewer)$
windowrule = float, title:^(Volume Control)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, title:^(Authentication Required)$
windowrule = float, title:^(Bluetooth Devices)$
windowrule = float, title:^(iwgtk)$
windowrule = float, title:^(dconf Editor)$

windowrule = float, zoom

windowrule = float, title:^(LibreWolf — Sharing Indicator)$
windowrule = float, title:^(FireDragon — Sharing Indicator)$
windowrule = float, title:^(Firefox — Sharing Indicator)$

windowrule = stayfocused, ^(rofi)$
windowrule = xray 1, ^(kitty$)
windowrule = xray 1, ^(Alacritty$)

workspace = name:special:2,rounding:false,bordersize:0
# workspace = name:special:2,gapsout:40,bordersize:0

layerrule = blur,gtk-layer-shell
layerrule = blur,notifications
layerrule = blur,rofi
layerrule = blur,wofi
layerrule = blur,waybar

$mainMod = SUPER

#Special Workspace

bind = $mainMod,S,togglespecialworkspace,1
bind = $mainMod,S,exec,[workspace special:1;silent;noanim] ferdium --enable-features=WaylandWindowDecorations --ozone-platform=wayland
bind = $mainMod ALT, S, movetoworkspace, special:1
bind = $mainMod ALT, M, movetoworkspace, special:3
bind = $mainMod,T,togglespecialworkspace,2
bind = $mainMod,M,togglespecialworkspace,3

bind = $mainMod, B, exec, librewolf
bind = $mainMod, Return, exec, kitty -1
bind = $mainMod ALT, T, exec, kitty -1

bind = , Print, exec, ~/.local/bin/grimblast --notify copy screen
bind = ALT, Print, exec, ~/.local/bin/grimblast --notify copy active
bind = SHIFT, Print, exec, ~/.local/bin/grimblast --notify --freeze --cursor copy area
bind = $mainMod, Print, exec, ~/.local/bin/grimblast --notify copysave screen
bind = $mainMod ALT, Print, exec, ~/.local/bin/grimblast --notify copysave active
bind = $mainMod SHIFT, Print, exec, ~/.local/bin/grimblast --notify --freeze copysave area

bind = $mainMod SHIFT, C, exec, hyprpicker -a -n
bind = $mainMod, W, exec, kill -USR1 $(pgrep waybar)||waybar
bind = $mainMod SHIFT, W, exec, kill -USR2 $(pgrep waybar)
bind = $mainMod CTRL, L, exec, swaylock

bind = $mainMod, SPACE, exec, kill $(pgrep rofi)||rofi -show drun
# $mainMod, R, exec, killall anyrun||/home/***REMOVED***/.local/share/cargo/bin/anyrun -o libshell.so
# bind = $mainMod, period, exec, killall rofi || rofi -show emoji -emoji-format "{emoji}" -modi emoji -theme ~/.config/rofi/global/emoji
bind = $mainMod, escape, exec, kill $(pgrep wlogout)||wlogout --protocol layer-shell -b 5 -T 450 -B 450
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, A, exec, ~/.local/bin/jerry --rofi -q 1080
bind = $mainMod SHIFT, A, exec, ~/.local/bin/jerry --rofi --dub -q 1080
bind = $mainMod ALT, A, exec, ani-cli --rofi -q best
bind = $mainMod ALT SHIFT, A, exec, ani-cli --rofi --dub -q best

bind = $mainMod, C, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, F, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, I, togglesplit


# Window Management

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod ALT, H, movewindow, l
bind = $mainMod ALT, L, movewindow, r
bind = $mainMod ALT, K, movewindow, u
bind = $mainMod ALT, J, movewindow, d

binde = $mainMod SHIFT, H, resizeactive, -20 0
binde = $mainMod SHIFT, L, resizeactive, 20 0
binde = $mainMod SHIFT, K, resizeactive, 0 -20
binde = $mainMod SHIFT, J, resizeactive, 0 20

# Group
bind = $mainMod, g, togglegroup
bind = $mainMod, tab, changegroupactive

bind = $mainMod CTRL, H, moveintogroup, l
bind = $mainMod CTRL, L, moveintogroup, r
bind = $mainMod CTRL, K, moveintogroup, u
bind = $mainMod CTRL, J, moveintogroup, d

# Bind brightness and audio control
binde = , XF86MonBrightnessUp, exec, ~/.local/bin/changeBrightness +5%
binde = , XF86MonBrightnessDown, exec, ~/.local/bin/changeBrightness 5%-
binde = , XF86AudioRaiseVolume, exec, ~/.local/bin/changeVolume 5%+
binde = , XF86AudioLowerVolume, exec, ~/.local/bin/changeVolume 5%-
binde = , XF86AudioMute, exec, pamixer --toggle-mute

# bind = $mainMod, 0, exec, ~/.local/bin/hyprctlZoom 0
binde = $mainMod, equal, exec, ~/.local/bin/hyprctlZoom 1
binde = $mainMod, minus, exec, ~/.local/bin/hyprctlZoom 2

# Workspace
bind = $mainMod, grave, workspace, +1
bind = $mainMod SHIFT, grave, workspace, -1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod ALT, down, workspace, e+1
bind = $mainMod ALT, up, workspace, e-1

bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
